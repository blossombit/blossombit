<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viktorija's Home Page</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(to bottom, #ffe0f0, #fff0f8);
      color: #4b2c5e;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      color: #e75480;
    }
    img {
      width: 210px;
      border-radius: 50%;
      margin: 30px 0;
    }
    p {
      font-size: 1.2em;
    }
    .footer {
      margin-top: 30px;
      font-size: 0.9em;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌸 Welcome to Viktorija's Page 🌸</h1>
    <img src="sobaki.jpg" alt="A cute kitten for Viktorija">
    <p>Hello! My name is <strong>Viktorija</strong> and this is my very own web page.</p>
    <p>I love drawing, playing with my sister, and cuddling with my doggies!🐶.</p>
    <div class="footer">
      Made with 💖 just for fun!
    </div>
  </div>
</body>
</html>
